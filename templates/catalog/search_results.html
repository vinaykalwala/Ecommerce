{% extends 'base.html' %}

{% block content %}

<h2>
Search Results
</h2>

<form method="get">

    <input
        type="text"
        name="q"
        value="{{ query }}"
    >

    <button>
        Search
    </button>

</form>

<hr>

{% for product in products %}

<p>

<a href="{% url 'product_detail' product.slug %}">
    {{ product.name }}
</a>

</p>

{% empty %}

<p>No products found.</p>

{% endfor %}

{% endblock %}
