{% extends 'base.html' %}
{% block title %}Edit User Permissions{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Edit User Permissions</h4>
            </div>
            <div class="card-body">
                <h5 class="mb-3">User: {{ edit_user.email }}</h5>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">User Type</label>
                        <select name="user_type" class="form-control">
                            <option value="customer" {% if edit_user.user_type == 'customer' %}selected{% endif %}>Customer</option>
                            <option value="admin" {% if edit_user.user_type == 'admin' %}selected{% endif %}>Admin</option>
                            <option value="superuser" {% if edit_user.user_type == 'superuser' %}selected{% endif %}>Superuser</option>
                        </select>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" {% if edit_user.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active Account</label>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_staff" class="form-check-input" {% if edit_user.is_staff %}checked{% endif %}>
                        <label class="form-check-label">Staff Status (Can access admin panel)</label>
                    </div>
                    
                    <hr>
                    
                    <h6>Specific Permissions (Optional)</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" name="permission_view_user" class="form-check-input" 
                                       {% if 'view_user' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can view users</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="permission_change_user" class="form-check-input"
                                       {% if 'change_user' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can change users</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="permission_view_product" class="form-check-input"
                                       {% if 'view_product' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can view products</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" name="permission_change_product" class="form-check-input"
                                       {% if 'change_product' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can change products</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="permission_view_order" class="form-check-input"
                                       {% if 'view_order' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can view orders</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="permission_change_order" class="form-check-input"
                                       {% if 'change_order' in edit_user.get_all_permissions %}checked{% endif %}>
                                <label class="form-check-label">Can change orders</label>
                            </div>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'user_management' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Permissions</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
