{% extends 'base.html' %}

{% block content %}

<h2>My Wishlist</h2>

{% if items %}

<table border="1">

<tr>
    <th>Product</th>
    <th>Action</th>
</tr>

{% for item in items %}

<tr>

<td>

<a href="{% url 'product_detail' item.product.slug %}">
    {{ item.product.name }}
</a>

</td>

<td>

<a href="{% url 'remove_from_wishlist' item.id %}">
    Remove
</a>

</td>

</tr>

{% endfor %}

</table>

{% else %}

<p>
Your wishlist is empty.
</p>

{% endif %}

{% endblock %}
